[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-verifier"
version = "0.1.0"
description = "Durable image verification service with pluggable backends"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
image-verifier = "image_verifier.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/image_verifier/api.py" = ["B008"]
"src/image_verifier/backends.py" = ["ASYNC109"] # Pass remaining budget into HTTP timeouts.
"tests/test_worker.py" = ["ASYNC109"]
